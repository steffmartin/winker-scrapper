name: Execução de Testes Unitários

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  python-tests:
    name: Testes Unitários - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema (Playwright)
        run: |
          sudo npx playwright install-deps

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv pypdf pywebview peewee coverage

      - name: Instalar Navegador Chromium (Playwright)
        run: |
          python -m playwright install chromium

      - name: Executar Testes de Unidade (Python)
        run: |
          # Descobre testes nas respectivas áreas com cobertura de statements e branches
          python -m coverage run --branch --source=compartilhado,bff,extrator --omit='*/test_*.py,*/tests/*' -m unittest discover -s . -p "test_*.py"
          python -m coverage json -o coverage.json --omit='*/test_*.py,*/tests/*'
          # Falha se statements ou branches ficarem abaixo de 90%
          python -c "import json,sys; t=json.load(open('coverage.json'))['totals']; print('Statements:', round(t['percent_statements_covered'],2), '% | Branches:', round(t['percent_branches_covered'],2), '%'); ok = t['percent_statements_covered'] >= 90 and t['percent_branches_covered'] >= 90; sys.exit(0 if ok else 'Cobertura abaixo de 90% em statements ou branches')"

          # Se novas pastas com scripts e testes Python forem adicionadas,
          # novos comandos de descoberta podem ser inseridos abaixo, por exemplo:
          # python -m coverage run --source=compartilhado,bff,extrator --omit='*/test_*.py,*/tests/*' -m unittest discover -s nova_pasta/ -p "test_*.py"

  frontend-tests:
    name: Testes Unitários - Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar Dependências do Frontend
        run: |
          cd dashboard
          npm ci

      - name: Executar Testes de Unidade (Angular)
        run: |
          cd dashboard
          # Executa os testes no modo headless para CI, com cobertura
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Verificar Cobertura Mínima do Frontend (90%)
        run: |
          node -e "const s=require('./dashboard/coverage/sakai-ng/coverage-summary.json').total; console.log('Lines:', s.lines.pct + '%', '| Statements:', s.statements.pct + '%', '| Branches:', s.branches.pct + '%', '| Functions:', s.functions.pct + '%'); const ok = s.lines.pct >= 90 && s.statements.pct >= 90 && s.branches.pct >= 90 && s.functions.pct >= 90; if (!ok) { console.error('Cobertura abaixo de 90% em uma ou mais métricas'); process.exit(1); }"
