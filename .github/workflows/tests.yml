name: Execução de Testes Unitários

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  python-tests:
    name: Testes Unitários - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema (Playwright)
        run: |
          sudo npx playwright install-deps

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv pypdf pywebview coverage

      - name: Instalar Navegador Chromium (Playwright)
        run: |
          python -m playwright install chromium

      - name: Executar Testes de Unidade (Python)
        run: |
          # Executa todos os testes na pasta 'scripts' com medição de cobertura
          python -m coverage run --source=scripts --omit='*/test_*.py' -m unittest discover -s scripts -p "test_*.py"
          # Falha se a cobertura de instruções ficar abaixo de 90%
          python -m coverage report --fail-under=90 --omit='*/test_*.py'

          # Se novas pastas com scripts e testes Python forem adicionadas,
          # novos comandos de descoberta podem ser inseridos abaixo, por exemplo:
          # python -m coverage run --source=scripts --omit='*/test_*.py' -m unittest discover -s nova_pasta/ -p "test_*.py"

  frontend-tests:
    name: Testes Unitários - Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar Dependências do Frontend
        run: |
          cd dashboard
          npm ci

      - name: Executar Testes de Unidade (Angular)
        run: |
          cd dashboard
          # Executa os testes no modo headless para CI, com cobertura
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Verificar Cobertura Mínima do Frontend (90%)
        run: |
          node -e "const s=require('./dashboard/coverage/sakai-ng/coverage-summary.json').total; console.log('Lines:', s.lines.pct + '%', '| Statements:', s.statements.pct + '%', '| Branches:', s.branches.pct + '%', '| Functions:', s.functions.pct + '%'); const ok = s.lines.pct >= 90 && s.statements.pct >= 90; if (!ok) { console.error('Cobertura abaixo de 90% em linhas ou statements'); process.exit(1); }"
